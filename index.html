<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>黒い砂漠 ボス出現タイマー</title>
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="hero" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">Black Desert Boss Timer</p>
          <h1 id="app-title">ボス出現タイマー</h1>
        </div>
        <div class="clock">
          <span id="current-date">--</span>
          <strong id="current-time">--:--:--</strong>
        </div>
      </section>

      <section class="next-panel" aria-label="次のボス">
        <div class="next-copy">
          <span class="label">次の対象ボス</span>
          <h2 id="next-boss">--</h2>
          <p id="next-detail">チェックされたボスから次回予定を計算します。</p>
        </div>
        <div class="countdown-block">
          <span id="next-time">--</span>
          <div class="countdown" id="countdown">--:--:--</div>
        </div>
      </section>

      <section class="toolbar" aria-label="アラーム設定">
        <button id="enable-audio" type="button">アラーム有効化</button>
        <button id="test-volume" type="button">音量テスト</button>
        <button id="stop-alarm" type="button" disabled>アラーム停止</button>
        <button id="reset-settings" type="button">設定リセット</button>
        <button id="export-settings" type="button">設定コピー</button>
        <label class="control-field">
          <span>音量 <strong id="volume-value">60%</strong></span>
          <input id="alarm-volume" type="range" min="0" max="100" value="60">
        </label>
        <label class="control-field compact">
          <span>アラーム音</span>
          <select id="alarm-sound">
            <option value="bell">ベル</option>
            <option value="chime">チャイム</option>
            <option value="alert">警告</option>
            <option value="reminder">リマインダー</option>
            <option value="until-stop">ストップまで</option>
          </select>
        </label>
        <label class="toggle">
          <input id="notify-toggle" type="checkbox">
          <span>通知も使う</span>
        </label>
      </section>

      <section class="status-panel" aria-label="状態">
        <div class="status-item" id="audio-status">音声: 未有効</div>
        <div class="status-item" id="notification-status">通知: 未確認</div>
        <div class="status-item" id="alarm-status">次回通知: --</div>
        <div class="status-item" id="missed-status">逃し通知: なし</div>
      </section>

      <details class="settings-panel" open>
        <summary>設定</summary>
        <section class="option-row" aria-label="通知タイミング">
        <div class="section-heading compact-heading">
          <h2>通知タイミング</h2>
          <span id="alert-summary">--</span>
        </div>
        <div id="alert-offsets" class="pill-list"></div>
        </section>
      </details>

      <section class="content">
        <aside class="boss-selector" aria-labelledby="boss-filter-title">
          <div class="section-heading">
            <h2 id="boss-filter-title">鳴らすボス</h2>
            <span id="selected-count">--</span>
          </div>
          <div class="preset-actions" aria-label="プリセット">
            <button data-preset="all" type="button">全部ON</button>
            <button data-preset="garmoth" type="button">ガーモスだけ</button>
            <button data-preset="loml" type="button">朝鮮ボス</button>
            <button data-preset="world" type="button">ワールドボス</button>
            <button data-preset="none" type="button">全部OFF</button>
          </div>
          <div id="boss-list" class="boss-list"></div>
        </aside>

        <section class="schedule-panel" aria-labelledby="today-title">
          <div class="section-heading">
            <h2 id="today-title">今日の予定</h2>
            <span id="today-count">--</span>
          </div>
          <div id="today-list" class="upcoming-list"></div>

          <div class="section-heading later-heading">
            <h2>明日以降</h2>
            <span id="later-count">--</span>
          </div>
          <div id="later-list" class="upcoming-list compact-list"></div>

          <div class="section-heading later-heading">
            <h2>次に鳴るアラーム</h2>
            <span id="alarm-count">--</span>
          </div>
          <div id="alarm-list" class="upcoming-list compact-list"></div>

          <div class="section-heading later-heading">
            <h2>アラーム履歴</h2>
            <button id="clear-history" type="button">履歴クリア</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
      </section>

      <details class="source-table">
        <summary>元の表を見る</summary>
        <img
          src="assets/boss-schedule.png"
          alt="黒い砂漠のワールドボス出現時間表"
        >
        <p>
          参照元:
          <a href="https://www.jp.playblackdesert.com/ja-JP/Wiki?wikiNo=69" target="_blank" rel="noreferrer">
            公式Wiki ワールドボス
          </a>
        </p>
      </details>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
